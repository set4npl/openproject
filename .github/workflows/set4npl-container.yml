name: SET4NPL / Build container

on:
  workflow_dispatch:
    inputs:
      target:
        description: Dockerfile target to publish
        required: true
        default: slim
        type: choice
        options:
          - slim
          - all-in-one
      image_tag:
        description: Immutable image tag
        required: true
        default: 17.7.2-set4npl.1
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          target: ${{ inputs.target }}
          push: true
          tags: ghcr.io/set4npl/openproject:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
